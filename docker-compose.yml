# ================================
# Docker Compose - Cyrene Notification API
# ================================

services:
  # --------------------------------
  # Main API Service
  # --------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyrene-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - EXPO_ACCESS_TOKEN=${EXPO_ACCESS_TOKEN}
      - TZ=${TZ:-Asia/Jakarta}
    env_file:
      - .env
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - cyrene-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  cyrene-network:
    driver: bridge
